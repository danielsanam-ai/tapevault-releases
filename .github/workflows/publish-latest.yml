name: publish-latest
# 릴리스가 게시(published)되면 그 릴리스의 latest.json 을 GitHub Pages 로 공개한다.
# 홈페이지는 https://danielsanam-ai.github.io/tapevault-releases/latest.json 을 읽는다 (CORS 허용, 호출 횟수 제한 없음).
on:
  release:
    types: [published]
  workflow_dispatch:

#
# 주의: 태그(release 이벤트)에서 배포하면 "성공"으로 끝나도 실제 사이트에는 반영되지 않는다(1.2.6 때 확인).
# 그래서 release 이벤트에서는 이 워크플로를 main 에서 다시 실행하게만 하고, 배포는 main 실행에서 한다.

permissions:
  contents: read

jobs:
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: main 에서 배포 실행
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-latest.yml -R "${{ github.repository }}" --ref main

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 최신 게시 릴리스의 latest.json 가져오기 (초안·프리릴리스 제외)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          [ -n "$tag" ] || { echo "게시된 릴리스가 없습니다"; exit 1; }
          gh release download "$tag" --pattern latest.json --dir site
          python3 - <<'PY'
          import json
          d = json.load(open("site/latest.json", encoding="utf-8"))
          assert d.get("schema") == 1 and d.get("version") and d.get("platforms"), "latest.json 형식 오류"
          for k, p in d["platforms"].items():
              assert p["url"].startswith("https://github.com/danielsanam-ai/tapevault-releases/releases/download/"), k
              assert len(p["sha256"]) == 64, k
          print("OK", d["version"], list(d["platforms"]))
          PY
          echo '{}' > site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
